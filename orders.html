<!DOCTYPE html>
<html lang="ar" dir="rtl" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omar Technology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <img class="logo" src="logo.png" alt="otlogo">
            <button onclick="toggleLanguage()" class="bg-gray-100 hover:bg-gray-200 text-sm py-1 px-3 rounded" id="lang-btn">English</button>
        </div>
        <div class="flex items-center gap-4 relative">
            <button onclick="toggleCart()" class="relative p-2 text-gray-600 hover:text-indigo-600">
                <i class="fas fa-shopping-cart text-xl"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
            </button>
            
            <!-- Menu Dropdown (Three Dots) -->
            <div class="relative">
                <button onclick="toggleMenu()" class="p-2 text-gray-600 hover:text-indigo-600">
                    <i class="fas fa-ellipsis-v text-xl"></i>
                </button>
                <div id="dropdown-menu" class="absolute left-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden z-50">
                    <button onclick="showOrdersModal()" class="block w-full text-right px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" id="menu-orders-btn">طلباتك (Your Orders)</button>
                    <button onclick="logout()" class="block w-full text-right px-4 py-2 text-sm text-red-600 hover:bg-gray-100" id="menu-logout-btn">تسجيل الخروج</button>
                </div>
            </div>
            <span id="user-display" class="text-sm font-medium text-gray-600 hidden"></span>
        </div>
    </nav>

    <!-- Auth Modal (Login) -->
    <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl">
            <h2 class="text-2xl font-bold mb-4 text-center text-indigo-600" id="auth-title">تسجيل الدخول</h2>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium mb-1" id="lbl-fname">الاسم الأول</label>
                        <input type="text" id="first-name" required class="w-full border rounded p-2 text-sm focus:outline-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1" id="lbl-lname">اسم العائلة</label>
                        <input type="text" id="last-name" required class="w-full border rounded p-2 text-sm focus:outline-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" id="lbl-email">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full border rounded p-2 text-sm focus:outline-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1" id="lbl-phone">رقم الهاتف</label>
                    <div class="flex gap-1" dir="ltr">
                        <select id="country-code" class="border rounded p-2 text-sm bg-gray-50 focus:outline-indigo-500">
                            <option value="+20">🇪🇬 +20</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+974">🇶🇦 +974</option>
                            <option value="+971">🇦🇪 +971</option>
                        </select>
                        <input type="tel" id="phone" required placeholder="123456789" class="w-full border rounded p-2 text-sm focus:outline-indigo-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded transition" id="btn-login-submit">دخول</button>
            </form>
        </div>
    </div>

    <!-- Main Store Content -->
    <main class="max-w-7xl mx-auto p-4">
        <h2 class="text-2xl font-bold mb-6 text-center" id="store-heading">المنتجات المتاحة</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be injected here via JS -->
        </div>
    </main>

    <!-- Shopping Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 max-w-md w-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col hidden">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50">
            <h3 class="text-lg font-bold text-indigo-900" id="cart-title">سلة التسوق</h3>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-800 text-xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Cart Items JS -->
        </div>
        <div class="p-4 border-t bg-gray-50 space-y-4">
            <div class="flex justify-between font-bold text-lg">
                <span id="cart-total-lbl">الإجمالي:</span>
                <span id="cart-total-price">0 $</span>
            </div>
            <p class="text-xs text-green-600 font-medium border border-green-200 bg-green-50 p-2 rounded text-center" id="whatsapp-note">
                💡 سيتم التواصل معك من قبل موظفينا على الواتساب فور إتمام الطلب.
            </p>
            <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded text-center transition" id="checkout-btn">تأكيد الطلب (Checkout)</button>
        </div>
    </div>

    <!-- Orders Modal -->
    <div id="orders-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-lg max-w-2xl w-full p-6 shadow-xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-indigo-600" id="orders-title">طلباتك السابقة</h3>
                <button onclick="closeOrdersModal()" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
            </div>
            <div id="orders-container" class="overflow-y-auto flex-1 space-y-4">
                <!-- Orders JS -->
            </div>
        </div>
    </div>

    <script>
        // Translations Object
        const translations = {
            ar: {
                title: "تسجيل الدخول", fname: "الاسم الأول", lname: "اسم العائلة", email: "البريد الإلكتروني", phone: "رقم الهاتف", loginBtn: "دخول",
                storeHeading: "المنتجات المتاحة", cartTitle: "سلة التسوق", total: "الإجمالي:", checkout: "تأكيد الطلب (Checkout)",
                note: "💡 سيتم التواصل معك من قبل موظفينا على الواتساب فور إتمام الطلب.", ordersTitle: "طلباتك السابقة",
                menuOrders: "طلباتك", menuLogout: "تسجيل الخروج", addToCart: "إضافة للسلة", limitNote: "الحد الأقصى 10 قطع",
                emptyCart: "السلة فارغة", orderId: "رقم الطلب:", qty: "الكمية:", status: "حالة الطلب: قيد المراجعة", langBtn: "English"
            },
            en: {
                title: "Login", fname: "First Name", lname: "Last Name", email: "Email", phone: "Phone Number", loginBtn: "Login",
                storeHeading: "Available Products", cartTitle: "Shopping Cart", total: "Total:", checkout: "Checkout",
                note: "💡 Our team will contact you via WhatsApp upon checking out.", ordersTitle: "Your Orders",
                menuOrders: "Your Orders", menuLogout: "Logout", addToCart: "Add to Cart", limitNote: "Max 10 items",
                emptyCart: "Cart is empty", orderId: "Order ID:", qty: "Qty:", status: "Status: Under Review", langBtn: "العربية"
            }
        };

        let currentLang = 'ar';
        let currentUser = null;
        let cart = [];

        // قائمة المنتجات الأصلية الخاصة بك مع إصلاح السنتاكس في أول عنصر
        const products = [
            { id: 1, nameAr: "موقع صغير", nameEn: "small website", price: 300 , image: "https://www.buildateam.io/wp-content/uploads/2017/02/feature.jpg" },
            { id: 2, nameAr: "موقع متوسط", nameEn: "medium website", price: 500 , image: "https://www.buildateam.io/wp-content/uploads/2017/02/feature.jpg" },
            { id: 3, nameAr: "موقع كبير", nameEn: "big website", price: 1300 , image: "https://www.buildateam.io/wp-content/uploads/2017/02/feature.jpg" },
            { id: 4, nameAr: "موقع كبير جدا", nameEn: "extreme big website", price: 2500 , image: "https://www.buildateam.io/wp-content/uploads/2017/02/feature.jpg" },
            { id: 5, nameAr: "فيديو صغير", nameEn: "small video", price: 50 , image: "https://www.elegantthemes.com/blog/wp-content/uploads/2020/05/featured-video-tools.png" },
            { id: 6, nameAr: " فيديو متوسط", nameEn: "medium video", price: 45.99 , image: "https://www.elegantthemes.com/blog/wp-content/uploads/2020/05/featured-video-tools.png" },
            { id: 7, nameAr: " فيديو كبير", nameEn: "big video", price: 120 , image: "https://www.elegantthemes.com/blog/wp-content/uploads/2020/05/featured-video-tools.png" },
            { id: 8, nameAr: "فيديو كبير جدا", nameEn: "extreme big video", price: 259 , image: "https://www.elegantthemes.com/blog/wp-content/uploads/2020/05/featured-video-tools.png" },
            { id: 9, nameAr: "عرض تقديمي صغير", nameEn: "small presentation", price: 99.99 , image: "https://venngage-wordpress.s3.amazonaws.com/uploads/2018/08/Presentation_Design_Guide_Blog_Header.png" },
            { id: 10, nameAr: "عرض تقديمي متوسط", nameEn: "medium presentation", price: 150 , image: "https://venngage-wordpress.s3.amazonaws.com/uploads/2018/08/Presentation_Design_Guide_Blog_Header.png" },
            { id: 11, nameAr: "عرض تقديمي كبير", nameEn: "big presentation", price: 350 , image: "https://venngage-wordpress.s3.amazonaws.com/uploads/2018/08/Presentation_Design_Guide_Blog_Header.png" },
            { id: 12, nameAr: "عرض تقديمي كبير جدا", nameEn: "extreme big presentation", price: 399 , image: "https://venngage-wordpress.s3.amazonaws.com/uploads/2018/08/Presentation_Design_Guide_Blog_Header.png" }
        ];

        window.onload = function() {
            checkAuth();
            renderProducts();
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const htmlTag = document.getElementById('app-html');
            htmlTag.setAttribute('lang', currentLang);
            htmlTag.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            
            // Apply text translations
            document.getElementById('lang-btn').innerText = translations[currentLang].langBtn;
            document.getElementById('auth-title').innerText = translations[currentLang].title;
            document.getElementById('lbl-fname').innerText = translations[currentLang].fname;
            document.getElementById('lbl-lname').innerText = translations[currentLang].lname;
            document.getElementById('lbl-email').innerText = translations[currentLang].email;
            document.getElementById('lbl-phone').innerText = translations[currentLang].phone;
            document.getElementById('btn-login-submit').innerText = translations[currentLang].loginBtn;
            document.getElementById('store-heading').innerText = translations[currentLang].storeHeading;
            document.getElementById('cart-title').innerText = translations[currentLang].cartTitle;
            document.getElementById('cart-total-lbl').innerText = translations[currentLang].total;
            document.getElementById('checkout-btn').innerText = translations[currentLang].checkout;
            document.getElementById('whatsapp-note').innerText = translations[currentLang].note;
            document.getElementById('orders-title').innerText = translations[currentLang].ordersTitle;
            document.getElementById('menu-orders-btn').innerText = translations[currentLang].menuOrders;
            document.getElementById('menu-logout-btn').innerText = translations[currentLang].menuLogout;

            renderProducts();
            renderCart();
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('activeUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('user-display').innerText = `${currentUser.firstName} ${currentUser.lastName}`;
                document.getElementById('user-display').classList.remove('hidden');
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const userId = 'ID_' + btoa(email).replace(/=/g, "").substring(0, 8); 

            currentUser = {
                id: userId,
                firstName: document.getElementById('first-name').value,
                lastName: document.getElementById('last-name').value,
                email: email,
                countryCode: document.getElementById('country-code').value,
                phone: document.getElementById('phone').value
            };

            localStorage.setItem('activeUser', JSON.stringify(currentUser));
            checkAuth();
        }

        function logout() {
            localStorage.removeItem('activeUser');
            currentUser = null;
            cart = [];
            document.getElementById('user-display').classList.add('hidden');
            document.getElementById('dropdown-menu').classList.add('hidden');
            checkAuth();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                const name = currentLang === 'ar' ? p.nameAr : p.nameEn;
                grid.innerHTML += `
                    <div class="bg-white border rounded-lg p-4 shadow-sm flex flex-col justify-between">
                        <div class="bg-gray-100 h-40 rounded mb-3 overflow-hidden flex items-center justify-center">
                            <img src="${p.image}" alt="${name}" class="w-full h-full object-cover">
                        </div>
                        <h4 class="font-bold text-lg mb-1">${name}</h4>
                        <p class="text-indigo-600 font-semibold mb-4">${p.price} $</p>
                        <button onclick="addToCart(${p.id})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm py-2 rounded transition">
                            ${translations[currentLang].addToCart}
                        </button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(item => item.id === id);

            if (cartItem) {
                if (cartItem.qty < 10) {
                    cartItem.qty++;
                } else {
                    alert(translations[currentLang].limitNote);
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                const newQty = item.qty + delta;
                if (newQty > 0 && newQty <= 10) {
                    item.qty = newQty;
                }
            }
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const countSpan = document.getElementById('cart-count');
            container.innerHTML = '';
            
            let total = 0;
            let totalItems = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 my-8">${translations[currentLang].emptyCart}</p>`;
            } else {
                cart.forEach(item => {
                    const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                    total += item.price * item.qty;
                    totalItems += item.qty;

                    container.innerHTML += `
                        <div class="flex justify-between items-center border-b pb-3" dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                            <div>
                                <h5 class="font-medium text-sm">${name}</h5>
                                <span class="text-xs text-gray-500">${item.price} $</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="flex items-center border rounded bg-white">
                                    <button onclick="updateQty(${item.id}, -1)" class="px-2 py-1 text-gray-600 text-sm hover:bg-gray-100">-</button>
                                    <span class="px-3 text-sm font-semibold">${item.qty}</span>
                                    <button onclick="updateQty(${item.id}, 1)" class="px-2 py-1 text-gray-600 text-sm hover:bg-gray-100">+</button>
                                </div>
                                <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 p-1">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('cart-total-price').innerText = `${total} $`;
            if (totalItems > 0) {
                countSpan.innerText = totalItems;
                countSpan.classList.remove('hidden');
            } else {
                countSpan.classList.add('hidden');
            }
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('translate-x-full');
        }

        function toggleMenu() {
            document.getElementById('dropdown-menu').classList.toggle('hidden');
        }

        function showOrdersModal() {
            toggleMenu();
            const modal = document.getElementById('orders-modal');
            const container = document.getElementById('orders-container');
            modal.classList.remove('hidden');
            container.innerHTML = '';

            const allOrders = JSON.parse(localStorage.getItem('all_orders') || '[]');
            const userOrders = allOrders.filter(o => o.customer.id === currentUser.id);

            if (userOrders.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">لا يوجد طلبات سابقة بعد.</p>`;
                return;
            }

            userOrders.forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                    itemsHtml += `<li>• ${name} (${translations[currentLang].qty} ${item.qty})</li>`;
                });

                container.innerHTML += `
                    <div class="border rounded-lg p-4 bg-gray-50 shadow-sm">
                        <div class="flex justify-between text-sm text-gray-500 mb-2">
                            <span><strong>${translations[currentLang].orderId}</strong> ${order.orderId}</span>
                            <span>${order.date}</span>
                        </div>
                        <ul class="text-sm space-y-1 text-gray-700 mb-2">${itemsHtml}</ul>
                        <div class="flex justify-between items-center font-bold text-sm border-t pt-2">
                            <span>${translations[currentLang].total} ${order.total} $</span>
                            <span class="text-amber-600">${translations[currentLang].status}</span>
                        </div>
                    </div>
                `;
            });
        }

        function closeOrdersModal() {
            document.getElementById('orders-modal').classList.add('hidden');
        }

        // إرجاع دالة الـ checkout للعمل بشكل طبيعي
        function checkout() {
            if (cart.length === 0) return alert(translations[currentLang].emptyCart);
            if (!currentUser) return checkAuth();

            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const newOrder = {
                orderId: orderId,
                date: new Date().toLocaleString(),
                customer: currentUser,
                items: cart,
                total: total
            };

            const globalOrders = JSON.parse(localStorage.getItem('all_orders') || '[]');
            globalOrders.push(newOrder);
            localStorage.setItem('all_orders', JSON.stringify(globalOrders));

            alert(translations[currentLang].note);
            cart = [];
            renderCart();
            toggleCart();
        }
    </script>
    <style>
        .logo {
            height: 100px;
        }
        .header {
            background-image: url(navbg.png);
        }
    </style>
</body>
</html>
